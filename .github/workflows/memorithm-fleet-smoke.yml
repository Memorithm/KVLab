name: Memorithm fleet main CI

on:
  push:
    branches: [main]
    paths:
      - 'kvlab/**'
      - 'tests/**'
      - 'rust/bkv_scan/**'
      - '.github/workflows/memorithm-fleet-smoke.yml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memorithm-fleet-main-${{ github.repository }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: [self-hosted, Linux, ARM64, memorithm-ci, thor-general, ci-light, trusted-main]
    timeout-minutes: 15
    steps:
      - name: Verify non-privileged shared lane
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = tarek
          if sudo -n true 2>/dev/null; then exit 71; fi
          for forbidden in sudo wheel docker lxd; do ! id -nG | grep -qw "$forbidden"; done
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Compile
        run: python3 -m compileall -q kvlab tests
      - name: Tests
        run: python3 -m unittest discover -s tests -v

  rust-bkv:
    runs-on: [self-hosted, Linux, ARM64, memorithm-ci, thor-general, ci-heavy, trusted-main]
    timeout-minutes: 20
    steps:
      - name: Verify non-privileged shared lane
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = tarek
          if sudo -n true 2>/dev/null; then exit 71; fi
          for forbidden in sudo wheel docker lxd; do ! id -nG | grep -qw "$forbidden"; done
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path rust/bkv_scan/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --locked --manifest-path rust/bkv_scan/Cargo.toml --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --manifest-path rust/bkv_scan/Cargo.toml
      - name: Record locked dependency graph
        run: |
          set -euo pipefail
          evidence=target/dependency-evidence
          mkdir -p "$evidence"
          cp rust/bkv_scan/Cargo.lock "$evidence/Cargo.lock"
          cargo metadata --locked --manifest-path rust/bkv_scan/Cargo.toml --format-version 1 > "$evidence/cargo-metadata.json"
          sha256sum "$evidence/Cargo.lock" "$evidence/cargo-metadata.json" > "$evidence/SHA256SUMS"
      - name: Retain locked dependency graph
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kvlab-main-dependencies-${{ github.sha }}
          path: target/dependency-evidence
          if-no-files-found: error
          retention-days: 30
