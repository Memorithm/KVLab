name: Memorithm fleet main CI

on:
  push:
    branches: [main]
    paths:
      - 'kvlab/**'
      - 'tests/**'
      - 'rust/bkv_scan/**'
      - '.github/workflows/memorithm-fleet-smoke.yml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memorithm-fleet-main-${{ github.repository }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: [self-hosted, Linux, ARM64, memorithm-ci, thor-general, ci-light, trusted-main]
    timeout-minutes: 15
    steps:
      - name: Verify non-privileged shared lane
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = tarek
          if sudo -n true 2>/dev/null; then exit 71; fi
          for forbidden in sudo wheel docker lxd; do ! id -nG | grep -qw "$forbidden"; done
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Compile
        run: python3 -m compileall -q kvlab tests
      - name: Tests
        run: python3 -m unittest discover -s tests -v

  rust-bkv:
    runs-on: [self-hosted, Linux, ARM64, memorithm-ci, thor-general, ci-heavy, trusted-main]
    timeout-minutes: 20
    steps:
      - name: Verify non-privileged shared lane
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = tarek
          if sudo -n true 2>/dev/null; then exit 71; fi
          for forbidden in sudo wheel docker lxd; do ! id -nG | grep -qw "$forbidden"; done
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path rust/bkv_scan/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path rust/bkv_scan/Cargo.toml --all-targets -- -D warnings
      - name: Tests
        run: cargo test --manifest-path rust/bkv_scan/Cargo.toml
