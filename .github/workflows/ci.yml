name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m compileall -q kvlab tests
      - name: Tests
        run: python -m unittest discover -s tests -v

  rust-bkv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path rust/bkv_scan/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --locked --manifest-path rust/bkv_scan/Cargo.toml --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --manifest-path rust/bkv_scan/Cargo.toml
      - name: Record locked dependency graph
        run: |
          set -euo pipefail
          evidence=target/dependency-evidence
          mkdir -p "$evidence"
          cp rust/bkv_scan/Cargo.lock "$evidence/Cargo.lock"
          cargo metadata --locked --manifest-path rust/bkv_scan/Cargo.toml --format-version 1 > "$evidence/cargo-metadata.json"
          sha256sum "$evidence/Cargo.lock" "$evidence/cargo-metadata.json" > "$evidence/SHA256SUMS"
      - name: Retain locked dependency graph
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kvlab-dependencies-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/dependency-evidence
          if-no-files-found: error
          retention-days: 30
