name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m compileall -q kvlab tests
      - name: Tests
        run: python -m unittest discover -s tests -v

  rust-bkv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path rust/bkv_scan/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path rust/bkv_scan/Cargo.toml --all-targets -- -D warnings
      - name: Tests
        run: cargo test --manifest-path rust/bkv_scan/Cargo.toml
