name: Temporary persist position campaign spec

on:
  push:
    branches:
      - fix/persist-position-campaign-spec

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/persist-position-campaign-spec
      - name: Patch publisher and tests
        shell: python
        run: |
          from pathlib import Path

          source = Path("kvlab/prospect_real_model_campaign_v4.py")
          s = source.read_text()
          if '(stage / "campaign.json")' not in s:
              old_call = '_publish_atomically(destination, encoded_records, manifest)'
              new_call = '_publish_atomically(destination, spec.canonical_json(), encoded_records, manifest)'
              assert old_call in s
              s = s.replace(old_call, new_call, 1)

              old_sig_line = '    records: Sequence[tuple[str, str, str]],\n'
              assert old_sig_line in s
              sig_at = s.index('def _publish_atomically(')
              prefix = s[:sig_at]
              suffix = s[sig_at:]
              suffix = suffix.replace(
                  old_sig_line,
                  '    campaign_payload: str,\n' + old_sig_line,
                  1,
              )
              s = prefix + suffix

              loop_marker = '        for filename, payload, _digest in records:'
              loop_replacement = '''        (stage / "campaign.json").write_text(
              campaign_payload, encoding="utf-8"
          )
              for filename, payload, _digest in records:'''
              assert loop_marker in s
              s = s.replace(loop_marker, loop_replacement, 1)
              source.write_text(s)

          tests = Path("tests/test_prospect_real_model_campaign_v4.py")
          t = tests.read_text()
          if 'on_disk_campaign = (output / "campaign.json")' not in t:
              marker = '            on_disk_manifest = (output / "manifest.json").read_text(encoding="utf-8")'
              replacement = '''            on_disk_campaign = (output / "campaign.json").read_text(encoding="utf-8")
              self.assertEqual(on_disk_campaign, spec.canonical_json())
              self.assertEqual(
                  hashlib.sha256(on_disk_campaign.encode("utf-8")).hexdigest(),
                  manifest.campaign_spec_sha256,
              )
              on_disk_manifest = (output / "manifest.json").read_text(encoding="utf-8")'''
              assert marker in t
              t = t.replace(marker, replacement, 1)
              tests.write_text(t)
      - name: Run focused tests
        run: python -m unittest discover -s tests -p 'test_prospect_real_model_campaign_v4.py'
      - name: Commit patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "MEMOPERF"
          git config user.email "contact@checkupauto.fr"
          git add kvlab/prospect_real_model_campaign_v4.py tests/test_prospect_real_model_campaign_v4.py
          git commit -m "fix(campaign): persist canonical campaign spec"
          git push origin HEAD:fix/persist-position-campaign-spec
