name: EWW structural campaign smoke

on:
  pull_request:
    paths:
      - 'rust/bkv_scan/**'
      - 'scripts/run-eww-campaign-smoke.sh'
      - '.github/workflows/eww-structural-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eww-structural-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.89.0
      - name: Run preregistered EWW structural smoke
        run: bash scripts/run-eww-campaign-smoke.sh
      - name: Retain runner-local EWW evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eww-structural-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/eww-evidence
          if-no-files-found: error
          retention-days: 14
