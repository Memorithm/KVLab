name: Reproduce and repair Prospect metric overflow

on:
  push:
    branches: [fix/prospect-metric-delta-overflow]
    paths: [.github/workflows/tmp-prospect-delta-prepare.yml]

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/prospect-metric-delta-overflow
      - name: Reproduce both failures in the original implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import unittest
          p = Path('kvlab/prospect_real_model_eviction.py')
          data = p.read_bytes()
          actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          assert actual == '213dedd6eb9e5fc997d1d6fc71c6548216097ced', 'original source drift'
          tests = unittest.defaultTestLoader.discover('tests', pattern='test_prospect_metric_delta_finiteness.py')
          result = unittest.TextTestRunner(verbosity=2).run(tests)
          assert not result.wasSuccessful(), 'expected original regression did not reproduce'
          assert not result.errors, result.errors
          names = [case.id() for case, _ in result.failures]
          assert any('test_rejects_finite_fields_with_overflowing_derived_delta' in name for name in names)
          assert any('test_nonfinite_comparison_operands_never_match' in name for name in names)
          PY
      - name: Apply finite guard and run all Python tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('kvlab/prospect_real_model_eviction.py')
          source = p.read_text()
          old = 'def _nearly_equal(left: float, right: float) -> bool:\n    scale ='
          new = 'def _nearly_equal(left: float, right: float) -> bool:\n    # Finite endpoints can yield an infinite derived delta. Do not admit it\n    # through a relative-tolerance comparison of infinity against infinity.\n    if not math.isfinite(left) or not math.isfinite(right):\n        return False\n    scale ='
          assert source.count(old) == 1
          p.write_text(source.replace(old, new))
          PY
          python3 -m compileall -q kvlab tests
          python3 -m unittest discover -s tests -v
      - name: Commit repair and remove preparation workflow
        run: |
          git config user.name 'MEMOPERF'
          git config user.email 'contact@checkupauto.fr'
          git add kvlab/prospect_real_model_eviction.py
          git rm .github/workflows/tmp-prospect-delta-prepare.yml
          git commit -m 'fix(prospect): reject non-finite derived metric deltas'
          git push origin HEAD:fix/prospect-metric-delta-overflow
